{% extends "base.html" %}
{% block title %}Daftarkan motor · ParkirPlat{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Daftarkan motor</h1>
  <p class="lead">Isi sekali. Setelah petugas memeriksa STNK, kamera gerbang mengenali plat kamu otomatis, tanpa karcis.</p>
  {% if msg %}<div class="note {{ tone }}" role="status">{{ msg }}</div>{% endif %}
  <form method="post" action="/daftar" enctype="multipart/form-data" class="form">
    <label>Plat nomor
      <input class="plate-input" name="plate" required maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="L 1234 AB" value="{{ form.plate or '' }}">
    </label>
    <label>Nama pemilik (sesuai STNK)
      <input name="owner_name" required autocomplete="name" value="{{ form.owner_name or '' }}">
    </label>
    <label>No. HP
      <input name="phone" type="tel" inputmode="tel" autocomplete="tel" value="{{ form.phone or '' }}">
    </label>
    <label>Foto STNK
      <input type="file" name="stnk" accept="image/*" capture="environment" required>
    </label>
    <button class="btn primary">Kirim pendaftaran</button>
  </form>
</section>
{% endblock %}
