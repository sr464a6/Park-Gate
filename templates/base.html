<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ParkirPlat{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="/">Parkir<span>Plat</span></a>
  <nav>
    <a href="/" {% if active == 'daftar' %}aria-current="page"{% endif %}>Daftar motor</a>
    <a href="/gerbang" {% if active == 'gerbang' %}aria-current="page"{% endif %}>Gerbang</a>
    <a href="/riwayat" {% if active == 'riwayat' %}aria-current="page"{% endif %}>Riwayat</a>
    <a href="/kendaraan" {% if active == 'kendaraan' %}aria-current="page"{% endif %}>Kendaraan</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
